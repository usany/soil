name: Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # 1. Collect Notion links from the OIA board -> saves into MongoDB `semesters` collection
      - name: Get Notion links
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm run get-notion-links

      # 2. Scrape Notion pages into MongoDB (reads semester keys from the `semesters` collection)
      - name: Scrape Notion
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm run scrape -- --all

      # 3. Geocode universities (adds lat/lon via Nominatim)
      - name: Geocoding
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm run geocode

      # 4. Compute nearest airport for each university
      - name: Nearest airport
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: pnpm run nearest-airport
